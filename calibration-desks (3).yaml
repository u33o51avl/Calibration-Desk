script-path: ./script.py
clone-mode: Full
cb-selection: true
node-dump: true

calibration:
  export-format: dcm
  export-options:
    Encoding: Windows_1252
    AddAxis: true
    Filter:
      Type: Label
      FilterBy:
        - "*"
    BooleanDisplayFormat: True_False
    ExportGroupLabelsWithoutValidAxis: false
    # Version: v2_0
    # ExportA2LBasedNumberOfDigits: false
    # FormatVersion: v2_0
    ExportGroupLabelsWithoutValidAxis: false
#
custom-fields:

  - name: start Model.CONNECT
    argument-name: start-model-connect
    type: CheckBox
    required: false
    default-value: "False"

  - name: Vehicle
    argument-name: vehicle
    type: ComboBox
    required: true
    values:
      - Vehicle 1
      - Vehicle 2
      - attribute-suid: "T31_96"

  - name: Vehicle Hidden
    argument-name: vehicle_hidden
    type: ComboBox
    required: true
    values:
      - Vehicle 1 Hidden
      - Vehicle 2 Hidden
    hidden: true
    default-value: "Vehicle 2 Hidden"

  - name: Release Date
    argument-name: rel-date
    type: TextBox
    attribute-suid: "T31_96"

  - name: Build Number
    argument-name: build-number
    type: SpinEdit
    default-value: 7
    required: true
    
  - name: Is Production
    argument-name: productive
    type: CheckBox
